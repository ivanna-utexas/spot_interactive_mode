centerpoint_people_node:
  ros__parameters:
    points_topic: /velodyne_points
    people_topic: /people_detections
    map_topic: /people/map_tracks
    nearby_topic: /nearby_people
    marker_topic: /people_detections_markers
    diagnostics_topic: /centerpoint_people/diagnostics

    tracking_frame: odom
    map_frame: map
    base_frame: base_link

    # The launch file derives these from the active workspace. They may be
    # overridden explicitly for deployments with external model storage.
    model_plan_path: ""
    scn_onnx_path: ""
    require_versioned_engine: true

    # Ten VLP-16 sweeps approximate the temporal density used by nuScenes.
    sweep_count: 10
    reset_gap_sec: 1.0
    z_offset: 0.0
    intensity_scale: 1.0

    # Detection/tracker score hysteresis.
    score_threshold: 0.5
    maintain_score_threshold: 0.3
    association_gate_m: 1.5
    mahalanobis_gate: 9.21
    association_velocity_weight: 0.5
    position_measurement_noise: 0.25
    velocity_measurement_noise: 2.0
    position_process_noise: 1.0
    velocity_process_noise: 2.0
    # A tentative track must match a spawn-strength detection on confirm_hits
    # frames, missing at most tentative_max_misses of them; otherwise it is
    # dropped. Confirmed tracks coast max_coast_frames scans (1.5 s at 10 Hz)
    # so brief occlusions do not cause a new person ID.
    confirm_hits: 3
    tentative_max_misses: 0
    max_coast_frames: 15

    # Pedestrian boxes outside these limits are discarded before tracking.
    # max_range_m is horizontal distance from the LiDAR; 0 disables it.
    min_height_m: 1.0
    max_height_m: 2.2
    max_footprint_m: 1.2
    max_range_m: 10.0

    max_obstacles: 16
    tf_timeout_sec: 0.05
    publish_markers: true
    verbose: false
